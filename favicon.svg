<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48">
  <!-- Sombra -->
  <ellipse cx="32" cy="45" rx="26" ry="3" fill="rgba(0,0,0,0.25)"/>

  <!-- Spoiler trasero -->
  <rect x="3" y="14" width="8" height="2.5" rx="1.2" fill="#a00020"/>
  <rect x="6" y="12" width="2.5" height="5" rx="1" fill="#a00020"/>

  <!-- Cuerpo principal -->
  <path d="M6 30 Q5 22 10 19 L18 15 Q24 7 34 7 Q44 7 51 13 L58 19 Q61 23 60 30 Q59 35 54 36 L10 36 Q6 35 6 30z" fill="#cc0000"/>

  <!-- Techo / cabina -->
  <path d="M18 17 Q24 9 34 9 Q43 9 50 15 L53 20 L15 20z" fill="#b00020"/>

  <!-- Parabrisas -->
  <path d="M22 18 Q27 11 34 11 Q41 11 46 16 L49 20 L19 20z" fill="#aee4f8" opacity="0.92"/>

  <!-- Raya lateral dorada (lightning bolt deco) -->
  <path d="M14 27 L56 27" stroke="#FFD700" stroke-width="1.5" opacity="0.4"/>

  <!-- Rayo McQueen -->
  <path d="M33 17 L27 27 L33 27 L28 37 L40 25 L34 25z" fill="#FFD700" stroke="#c8a000" stroke-width="0.4"/>

  <!-- Número 95 -->
  <text x="50" y="33" font-family="Arial Black,sans-serif" font-size="8" font-weight="900" fill="white" text-anchor="middle">95</text>

  <!-- Rueda delantera -->
  <circle cx="15" cy="36" r="8" fill="#1a1a1a"/>
  <circle cx="15" cy="36" r="5" fill="#444"/>
  <circle cx="15" cy="36" r="2.5" fill="#888"/>

  <!-- Rueda trasera -->
  <circle cx="50" cy="36" r="8" fill="#1a1a1a"/>
  <circle cx="50" cy="36" r="5" fill="#444"/>
  <circle cx="50" cy="36" r="2.5" fill="#888"/>

  <!-- Ojo izquierdo (frente) -->
  <ellipse cx="57" cy="25" rx="3.5" ry="4.5" fill="white"/>
  <ellipse cx="57" cy="25.5" rx="2.2" ry="3" fill="#5bbfea"/>
  <ellipse cx="57.5" cy="24.5" rx="1" ry="1.3" fill="#1a80a0"/>
  <!-- Ceja -->
  <path d="M54 22 Q57 20 60 22" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Luz delantera -->
  <ellipse cx="60" cy="30" rx="1.8" ry="2.5" fill="#fffbe0" opacity="0.9"/>

  <!-- Detalle parachoques frontal -->
  <path d="M58 33 Q62 31 62 35 Q60 37 56 36" fill="#aa0000"/>
</svg>
